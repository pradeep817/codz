name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dev dependencies (TypeScript for the typecheck)
        run: npm install --no-audit --no-fund
      - name: Unit, golden and CLI tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Starter templates pass the publishing gates
        run: node scripts/starters.ts check starters/*/
      - name: Fuzz the parsers harder (Linux only)
        if: runner.os == 'Linux'
        run: FUZZ_RUNS=3000 node --test test/fuzz.test.ts
      - name: Generated docs are up to date
        run: npm run docs && git diff --exit-code docs/COMMANDS.md
      - name: CLI smoke test
        run: |
          node bin/codz.js --version
          node bin/codz.js doctor --setup --cwd fixtures/nextjs-helper --no-color || true

  generated-code:
    name: Generated code compiles (tsc + dart analyze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Run codz on every fixture and compile the result
        env:
          TSC: npx tsc
        run: bash ./scripts/check-generated.sh

  android:
    name: Created Android projects build (Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: codz create + session for each architecture, then assembleDebug and unit tests
        run: bash ./scripts/check-android.sh

  package:
    name: npm package runs on Node 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Build dist/ and check the package contents
        run: |
          npm run build
          npm pack --dry-run 2>&1 | tee pack.txt
          ! grep -q ' src/' pack.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Use the built CLI on Node 20
        run: |
          node bin/codz.js --version
          cp -R fixtures/nextjs-helper "$RUNNER_TEMP/app"
          cd "$RUNNER_TEMP/app"
          node "$GITHUB_WORKSPACE/bin/codz.js" init
          node "$GITHUB_WORKSPACE/bin/codz.js" api add --url https://api.example.com/orders --sample "$GITHUB_WORKSPACE/test/inputs/products.json" --yes --allow-dirty --no-verify
          test -f lib/api/orders.ts
          node "$GITHUB_WORKSPACE/bin/codz.js" doctor --setup
          node "$GITHUB_WORKSPACE/bin/codz.js" undo
