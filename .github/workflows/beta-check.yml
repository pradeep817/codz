name: Beta build check

# Runs scripts/check-all.sh: feature add, auth add and screen add on sample
# projects for every platform, then the platform's own build (tsc + vitest,
# dart analyze + flutter test, Gradle, swiftc). One job per platform group so a
# failure points at one stack; the logs are uploaded when a check fails.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *' # nightly: catches breakage from new package versions too

permissions:
  contents: read

concurrency:
  group: beta-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Next.js, React, React Native
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TMPDIR: ${{ runner.temp }}
      CHECK_STRICT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash scripts/check-all.sh --only next,react,rn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-web
          path: ${{ runner.temp }}/devtool-check.*/logs

  flutter:
    name: Flutter (Riverpod, GetX, get_it, Bloc)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TMPDIR: ${{ runner.temp }}
      CHECK_STRICT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash scripts/check-all.sh --only flutter
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-flutter
          path: ${{ runner.temp }}/devtool-check.*/logs

  android:
    name: Android (Compose with Hilt, Koin, no DI; XML Views)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TMPDIR: ${{ runner.temp }}
      CHECK_STRICT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      # ubuntu-latest has the Android SDK and sets ANDROID_HOME.
      - run: bash scripts/check-all.sh --only android
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-android
          path: ${{ runner.temp }}/devtool-check.*/logs

  ios:
    name: iOS (SwiftUI)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TMPDIR: ${{ runner.temp }}
      CHECK_STRICT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash scripts/check-all.sh --only ios
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-ios
          path: ${{ runner.temp }}/devtool-check.*/logs
