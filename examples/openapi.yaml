openapi: 3.0.3
info:
  title: Shop API (codz test)
  version: 1.0.0
  description: |
    Sample API for trying codz.
      codz api import openapi.yaml --list
      codz feature add products --spec openapi.yaml   # list, create, detail, edit
      codz feature add orders --spec openapi.yaml     # list, create, detail
      codz auth add                                   # uses /auth/login and /auth/me
servers:
  - url: https://api.example.com/v1
tags:
  - name: auth
  - name: products
  - name: orders

paths:
  # ---------- Sign-in (codz auth add) ----------
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        '204':
          description: Signed out

  # ---------- Products: full set (list, create, detail, edit, delete) ----------
  /products:
    get:
      operationId: listProducts
      tags: [products]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: search, in: query, schema: { type: string } }
        - name: category
          in: query
          schema: { type: string, enum: [electronics, home, clothing] }
      responses:
        '200':
          description: A page of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      operationId: createProduct
      tags: [products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
  /products/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getProduct
      tags: [products]
      responses:
        '200':
          description: One product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
    put:
      operationId: updateProduct
      tags: [products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
    delete:
      operationId: deleteProduct
      tags: [products]
      responses:
        '204':
          description: Deleted

  # ---------- Orders: nested objects and arrays ----------
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, paid, shipped, cancelled] }
      responses:
        '200':
          description: The user's orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      operationId: createOrder
      tags: [orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: One order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /orders/{orderId}/tracking:
    get:
      operationId: getOrderTracking
      tags: [orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Delivery tracking (try it with screen add)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tracking'

components:
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    LoginResponse:
      type: object
      required: [token]
      properties:
        token: { type: string }
        refreshToken: { type: string }
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required: [id, name, email]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string, format: email }
        avatar_url: { type: string, nullable: true }
    ProductInput:
      type: object
      required: [name, price, category]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        price: { type: number }
        category: { type: string, enum: [electronics, home, clothing] }
        in_stock: { type: boolean }
        tags:
          type: array
          items: { type: string }
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - type: object
          required: [id, created_at]
          properties:
            id: { type: integer, format: int64 }
            created_at: { type: string, format: date-time }
            rating: { type: number, nullable: true }
    OrderInput:
      type: object
      required: [items, shipping_address]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        shipping_address:
          $ref: '#/components/schemas/Address'
        note: { type: string, nullable: true }
    Order:
      type: object
      required: [id, status, items, total, created_at]
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, paid, shipped, cancelled] }
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        total: { type: number }
        shipping_address:
          $ref: '#/components/schemas/Address'
        created_at: { type: string, format: date-time }
    OrderItem:
      type: object
      required: [product_id, quantity]
      properties:
        product_id: { type: integer, format: int64 }
        quantity: { type: integer }
        unit_price: { type: number }
    Address:
      type: object
      required: [line1, city, country]
      properties:
        line1: { type: string }
        line2: { type: string, nullable: true }
        city: { type: string }
        postal_code: { type: string }
        country: { type: string }
    Tracking:
      type: object
      required: [order_id, status, events]
      properties:
        order_id: { type: string }
        status: { type: string }
        carrier: { type: string, nullable: true }
        events:
          type: array
          items:
            type: object
            required: [time, description]
            properties:
              time: { type: string, format: date-time }
              description: { type: string }
              location: { type: string, nullable: true }
