name: task_board
description: Task board app.
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  flutter_bloc: ^8.1.6
  freezed_annotation: ^3.0.0
  get_it: ^8.0.2
  go_router: ^14.6.0
  json_annotation: ^4.9.0
  # retrofit_generator 9.x does not know retrofit 4.10's Parser.DartMappable.
  retrofit: '>=4.4.1 <4.10.0'

dev_dependencies:
  build_runner: ^2.4.13
  flutter_test:
    sdk: flutter
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  retrofit_generator: ^9.1.5

flutter:
  uses-material-design: true
