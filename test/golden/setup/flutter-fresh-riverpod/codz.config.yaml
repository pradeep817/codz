# codz configuration. Commit this file.
# Values below were detected by `codz init` (or chosen in `codz setup`).
# Correct any that are wrong: codz always uses these values instead of guessing again.
framework: flutter
conventions:
  # package name from pubspec.yaml
  packageName: project
  # HTTP client: dio or http
  http: dio
  # model serialization: manual (hand-written fromJson), json_serializable or freezed
  serialization: manual
  # state management library
  stateManagement: riverpod
  # router library
  router: navigator
  # where model classes live
  modelsFolder: lib/data/models
  # suffix in model file names, for example _model, or empty
  modelFileSuffix: _model
  # suffix in model class names, for example Model, or empty
  modelClassSuffix: Model
  # annotation used on json_serializable models
  jsonAnnotation: ''
  # where repository or service classes live
  repoFolder: lib/data/repositories
  # class kind for API calls: repository, service or api
  repoKind: repository
  # name of the Dio field inside repository classes
  dioField: _dio
  # how repositories are registered: getx, riverpod, get_it or none
  di: riverpod
  # Dio base URL found in the code, if it is a literal
  baseUrl: https://api.yourapp.com
  # package or relative imports
  importStyle: package
  # indentation used in Dart files
  indent: 2
  # file that creates the Dio instance (mocks are registered there)
  networkFile: lib/core/network/dio_provider.dart
  # Riverpod provider that supplies Dio (riverpod only)
  dioProvider: dioProvider
  # file that defines the Dio provider (riverpod only)
  dioProviderFile: lib/core/network/dio_provider.dart
