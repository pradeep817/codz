openapi: 3.0.3
info:
  title: Shop API
  version: 1.0.0
servers:
  - url: https://api.yourapp.com/v1
tags:
  - name: users
  - name: orders
paths:
  /users:
    get:
      operationId: listUsers
      tags: [users]
      parameters:
        - name: page
          in: query
          schema: { type: integer }
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      operationId: createUser
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getUser
      tags: [users]
      responses:
        '200':
          description: One user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    delete:
      operationId: deleteUser
      tags: [users]
      responses:
        '204':
          description: Deleted
  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: One order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
components:
  schemas:
    NewUser:
      type: object
      required: [name, email]
      properties:
        name: { type: string }
        email: { type: string, format: email }
    User:
      allOf:
        - $ref: '#/components/schemas/NewUser'
        - type: object
          required: [id, created_at]
          properties:
            id: { type: integer, format: int64 }
            created_at: { type: string, format: date-time }
            role:
              type: string
              enum: [admin, member]
            avatar_url:
              type: string
              nullable: true
    Order:
      type: object
      required: [id, status, items, total]
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, paid, shipped] }
        total: { type: number }
        items:
          type: array
          items:
            type: object
            required: [sku, qty]
            properties:
              sku: { type: string }
              qty: { type: integer }
        shipping_address:
          $ref: '#/components/schemas/Address'
    Address:
      type: object
      properties:
        line1: { type: string }
        city: { type: string }
